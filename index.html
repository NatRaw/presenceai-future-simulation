<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PresenceAI · Future Simulation 2045</title>
  <meta name="description" content="Interactive future simulation about AI attendance registration, uncertainty and human control in higher education.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- ===== Top bar: PresenceAI branding, course context, simulated clock ===== -->
    <header class="topbar">
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 40 40" aria-hidden="true">
          <rect width="40" height="40" rx="10" fill="var(--brand)"/>
          <circle cx="20" cy="17" r="7" fill="none" stroke="#fff" stroke-width="2.6"/>
          <path d="M9 32c2.6-4.4 6.4-6.4 11-6.4s8.4 2 11 6.4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
          <circle cx="31" cy="9" r="3.4" fill="#7ee2b8"/>
        </svg>
        <div class="brand-text">
          <strong>PresenceAI</strong>
          <span>Attendance Registration</span>
        </div>
      </div>

      <div class="course" id="courseInfo"></div>

      <div class="top-actions">
        <div class="clock">
          <span>Simulated time</span>
          <strong id="clock">—</strong>
        </div>
        <button class="btn btn-icon" id="btnFullscreen" title="Toggle fullscreen (F)" aria-label="Toggle fullscreen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="btn btn-ghost" id="btnRestart">Restart simulation</button>
      </div>
    </header>

    <!-- ===== Progress + timeline ===== -->
    <nav class="progress" aria-label="Simulation progress">
      <div class="progress-label">
        <span class="future-pill">Future Simulation · 2045</span>
        <strong id="progressLabel">Briefing</strong>
      </div>
      <ol class="timeline" id="timeline"></ol>
    </nav>

    <!-- ===== Main simulation area (rendered by script.js) ===== -->
    <main class="stage" id="stage" tabindex="-1"></main>

    <!-- ===== Presenter controls ===== -->
    <footer class="controls">
      <button class="btn btn-secondary" id="btnBack">← Back</button>
      <div class="hint" id="hint"></div>
      <button class="btn btn-primary" id="btnContinue">Continue →</button>
    </footer>
  </div>

  <!-- Notification toasts -->
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <!-- Restart confirmation (custom modal so fullscreen is not interrupted) -->
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">Restart the simulation?</h2>
      <p>All choices will be cleared and you return to the briefing.</p>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="btnCancelRestart">Cancel</button>
        <button class="btn btn-primary" id="btnConfirmRestart">Restart</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
